<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Race Predictor | AI-Powered Win Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Color palette - more balanced than just red everywhere */
        :root {
            --f1-red: #e10600;
            --accent-teal: #00d9ff;
            --accent-purple: #9d4edd;
            --accent-orange: #ff6b35;
            --dark-bg: #0a0e14;
            --card-bg: #161b22;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --success-green: #3fb950;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #0d1117 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Subtle background pattern for depth */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(157, 78, 221, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 217, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        header {
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--text-main) 0%, var(--text-muted) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .highlight {
            background: linear-gradient(135deg, var(--f1-red) 0%, var(--accent-orange) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        select,
        input[type="number"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 1rem;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        /* Different focus colors for variety */
        select:focus {
            border-color: var(--accent-teal);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
        }

        input[type="number"]:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.3);
        }

        /* Custom range slider with gradient */
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-track {
            background: linear-gradient(to right, var(--success-green), var(--accent-orange), var(--f1-red));
            height: 6px;
            border-radius: 5px;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .btn-predict {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, var(--f1-red) 0%, var(--accent-orange) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(225, 6, 0, 0.4);
        }

        .btn-predict::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.5s;
        }

        .btn-predict:hover::before {
            left: 100%;
        }

        /* Results panel styling */
        .result-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .result-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .probability-ring {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 2rem;
            background: conic-gradient(rgba(255, 255, 255, 0.05) 0deg, transparent 0deg);
            transition: background 1s ease;
        }

        /* Inner circle for the ring effect */
        .probability-ring::before {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: var(--card-bg);
        }

        .prob-text {
            position: relative;
            font-size: 3rem;
            font-weight: 800;
            z-index: 2;
        }

        .prediction-label {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .prediction-label.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Loading spinner */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--accent-teal);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>F1 <span class="highlight">Predictor</span></h1>
    </header>

    <main>
        <div class="container">
            <!-- Input form on the left -->
            <div class="card">
                <form id="predict-form">
                    <div class="form-group">
                        <label>Driver</label>
                        <select id="driver" required></select>
                    </div>

                    <div class="form-group">
                        <label>Constructor (Team)</label>
                        <select id="constructor" required></select>
                    </div>

                    <div class="form-group">
                        <label>Circuit</label>
                        <select id="circuit" required></select>
                    </div>

                    <div class="form-group">
                        <label>Grid Start Position: <span id="grid-val" class="highlight">1</span></label>
                        <input type="range" id="grid" min="1" max="20" value="1">
                    </div>

                    <div class="form-group">
                        <label>Laps</label>
                        <input type="number" id="laps" value="50" min="1" max="100">
                    </div>

                    <div class="form-group">
                        <label>Current Points</label>
                        <input type="number" id="points" value="0" min="0">
                    </div>

                    <button type="submit" class="btn-predict">Analyze Race</button>
                </form>
            </div>

            <!-- Results panel on the right -->
            <div class="card result-panel">
                <div class="result-title">AI Win Probability</div>

                <div class="loader" id="loader"></div>

                <div class="probability-ring" id="prob-ring">
                    <span class="prob-text" id="prob-text">--</span>
                </div>

                <div class="prediction-label" id="prediction-label">
                    Ready to Predict
                </div>
            </div>
        </div>
    </main>

    <script>
        // Update the grid position display when slider moves
        const gridSlider = document.getElementById('grid');
        const gridDisplay = document.getElementById('grid-val');

        gridSlider.addEventListener('input', (e) => {
            gridDisplay.textContent = e.target.value;
        });

        // Load dropdown options when page loads
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/meta');
                const data = await response.json();

                fillDropdown('driver', data.drivers, 'max_verstappen');
                fillDropdown('constructor', data.constructors, 'red_bull');
                fillDropdown('circuit', data.circuits);
            } catch (error) {
                console.error("Couldn't load dropdown data:", error);
            }
        });

        function fillDropdown(dropdownId, items, defaultValue) {
            const dropdown = document.getElementById(dropdownId);

            // Sort alphabetically for easier browsing
            items.sort();

            items.forEach(item => {
                const option = document.createElement('option');
                option.value = item;
                option.textContent = item;
                dropdown.appendChild(option);
            });

            // Set a sensible default if provided
            if (defaultValue && items.includes(defaultValue)) {
                dropdown.value = defaultValue;
            }
        }

        // Handle form submission
        document.getElementById('predict-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.querySelector('.btn-predict');
            const loader = document.getElementById('loader');
            const ring = document.getElementById('prob-ring');
            const probText = document.getElementById('prob-text');
            const label = document.getElementById('prediction-label');

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.6';
            loader.style.display = 'block';
            ring.style.display = 'none';
            label.classList.remove('visible');

            // Gather form data
            const formData = {
                driver: document.getElementById('driver').value,
                constructor: document.getElementById('constructor').value,
                circuit: document.getElementById('circuit').value,
                grid: parseInt(document.getElementById('grid').value),
                laps: parseInt(document.getElementById('laps').value),
                points: parseFloat(document.getElementById('points').value)
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                // Small delay for effect
                setTimeout(() => {
                    loader.style.display = 'none';
                    ring.style.display = 'flex';

                    // Calculate and display percentage
                    const percentage = (result.probability * 100).toFixed(1);
                    probText.textContent = percentage + '%';

                    // Use gradient colors for the ring based on probability
                    let ringColor;
                    if (result.probability >= 0.7) {
                        ringColor = 'linear-gradient(135deg, var(--success-green), var(--accent-teal))';
                    } else if (result.probability >= 0.4) {
                        ringColor = 'linear-gradient(135deg, var(--accent-orange), var(--accent-purple))';
                    } else {
                        ringColor = 'rgba(139, 148, 158, 0.5)';
                    }

                    ring.style.background = `conic-gradient(${ringColor} ${percentage * 3.6}deg, rgba(255,255,255,0.05) ${percentage * 3.6}deg)`;

                    // Update prediction text
                    if (result.is_winner) {
                        label.textContent = '🏆 Winner Predicted!';
                        label.style.background = 'linear-gradient(135deg, var(--success-green), var(--accent-teal))';
                    } else {
                        label.textContent = 'Unlikely to Win';
                        label.style.background = 'none';
                        label.style.color = var(--text - muted);
                    }
                    label.style.backgroundClip = 'text';
                    label.style.webkitBackgroundClip = 'text';
                    label.style.webkitTextFillColor = result.is_winner ? 'transparent' : 'inherit';
                    label.classList.add('visible');

                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                }, 800);

            } catch (error) {
                console.error('Prediction failed:', error);
                loader.style.display = 'none';
                ring.style.display = 'flex';
                probText.textContent = 'Error';
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }
        });
    </script>
</body>

</html>
