<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Race Predictor</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

    <header>
        <div class="header-content">
            <i class="fas fa-flag-checkered header-icon"></i>
            <h1>F1 <span class="highlight">Race Predictor</span></h1>
            <p class="subtitle">AI-Powered Win Probability Analysis</p>
        </div>
    </header>

    <main>
        <div class="container">
            <!-- Input form on the left -->
            <div class="card">
                <form id="predict-form">
                    <div class="form-group">
                        <label><i class="fas fa-user-tie"></i> Driver</label>
                        <select id="driver" required></select>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-building"></i> Constructor (Team)</label>
                        <select id="constructor" required></select>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-map-marker-alt"></i> Circuit</label>
                        <select id="circuit" required></select>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-grip-lines-vertical"></i> Grid Start Position: <span id="grid-val"
                                class="highlight">1</span></label>
                        <input type="range" id="grid" min="1" max="20" value="1">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-circle-notch"></i> Laps</label>
                        <input type="number" id="laps" value="50" min="1" max="100">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-star"></i> Current Points</label>
                        <input type="number" id="points" value="0" min="0">
                    </div>

                    <button type="submit" class="btn-predict">
                        <i class="fas fa-brain"></i> Analyze Race
                    </button>
                </form>
            </div>

            <!-- Results panel on the right -->
            <div class="card result-panel">
                <div class="result-title">AI Win Probability</div>

                <div class="loader" id="loader"></div>

                <div class="probability-ring" id="prob-ring">
                    <span class="prob-text" id="prob-text">--</span>
                </div>

                <div class="prediction-label" id="prediction-label">
                    Ready to Predict
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
